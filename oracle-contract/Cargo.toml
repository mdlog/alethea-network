[package]
name = "oracle"
version = "0.1.0"
edition = "2021"

[workspace]
# This is a standalone package, not part of parent workspace

[dependencies]
async-graphql = "7.0.11"
linera-sdk = { git = "https://github.com/linera-io/linera-protocol.git", branch = "main" }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "oracle-contract"
path = "src/contract.rs"

[[bin]]
name = "oracle-service"
path = "src/service.rs"

[dev-dependencies]
linera-sdk = { git = "https://github.com/linera-io/linera-protocol.git", branch = "main", features = ["test"] }

[profile.release]
debug = false
lto = true
opt-level = "z"
strip = true
codegen-units = 1
panic = "abort"
