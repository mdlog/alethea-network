# 🏛️ Alethea Network - Divine Truth for Modern Markets
# Decentralized Oracle Platform built on Linera Blockchain

[workspace]
resolver = "2"
members = [
    "market-chain",
    "oracle-registry",
    "oracle-registry-v2",
    "voter-template",
    "alethea-sdk",
    "alethea-oracle-types",
    "integration-tests",
    "oracle-api-backend",
    "oracle-cli",
    "linera-executor", "oracle-backend",
]

[workspace.package]
name = "alethea-network"
version = "0.1.0"
edition = "2021"
authors = ["Alethea Network Team"]
description = "Decentralized oracle with commit-reveal voting on Linera blockchain"
repository = "https://github.com/mdlog/alethea-network"
license = "MIT OR Apache-2.0"
keywords = ["blockchain", "oracle", "linera", "prediction-markets", "defi"]
categories = ["cryptography::cryptocurrencies"]

[workspace.dependencies]
linera-sdk = "0.15.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1"
bcs = "0.1"
async-graphql = "7.0"
futures = "0.3"
sha2 = "0.10"
bincode = "1.3"
alethea-oracle-types = { path = "alethea-oracle-types" }

# Additional dependencies for protocol transformation
rand = "0.8"
hex = "0.4"
