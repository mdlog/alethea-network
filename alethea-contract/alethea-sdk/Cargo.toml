[package]
name = "alethea-sdk"
version = "0.2.0"
edition = "2021"
authors = ["Alethea Network Team"]
description = "Client SDK for integrating with Alethea Oracle Protocol (oracle-registry-v2)"
repository = "https://github.com/mdlog/alethea-network"
license = "MIT OR Apache-2.0"
keywords = ["blockchain", "oracle", "linera", "sdk"]

[dependencies]
linera-sdk = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
alethea-oracle-messages = { workspace = true }

[lib]
crate-type = ["lib"]
