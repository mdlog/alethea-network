[package]
name = "oracle-api-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Linera SDK
linera-sdk = "0.15"
linera-base = "0.15"
linera-core = "0.15"
linera-execution = "0.15"
linera-storage = "0.15"
linera-views = "0.15"
linera-rpc = "0.15"
linera-client = "0.15"

# Web framework
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async
async-trait = "0.1"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Oracle Registry types
oracle-registry-v2 = { path = "../oracle-registry-v2" }

# Utilities
hex = "0.4"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.11", features = ["json"] }
